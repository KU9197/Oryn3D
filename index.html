<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer</title>

    <script type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        model-viewer {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!--
      Size: the 3rd value of camera-orbit is the camera distance.
      100% = default framing. Higher = bottle looks smaller (try 150%–250%).
    -->
    <model-viewer
        id="bottle"
        src="Oryn.glb"
        camera-controls
        auto-rotate
        camera-orbit="0deg 75deg 180%"
        max-camera-orbit="Infinity 180deg 300%"
        shadow-intensity="1"
        exposure="1"
        tone-mapping="neutral">
    </model-viewer>

    <script type="module">
        // Colors sampled from the reference image
        const SAGE  = '#BFD3BE'; // body + lid
        const CORAL = '#D9877C'; // ring + spout accents

        // Any material whose name matches this gets the coral accent.
        // Check the browser console for your model's material names and adjust if needed.
        const ACCENT_PATTERN = /ring|band|spout|accent|trim|seal|button|tab/i;

        const viewer = document.getElementById('bottle');

        viewer.addEventListener('load', () => {
            console.log('Materials:', viewer.model.materials.map(m => m.name));

            for (const mat of viewer.model.materials) {
                const pbr = mat.pbrMetallicRoughness;

                // Remove any color texture so the flat color shows through
                if (pbr.baseColorTexture && pbr.baseColorTexture.texture) {
                    pbr.baseColorTexture.setTexture(null);
                }

                pbr.setBaseColorFactor(ACCENT_PATTERN.test(mat.name) ? CORAL : SAGE);

                // Soft matte finish like the reference
                pbr.setMetallicFactor(0);
                pbr.setRoughnessFactor(0.55);
            }
        });
    </script>

</body>
</html>
